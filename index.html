<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Project HQ"/>
<meta name="theme-color" content="#0a0a0c"/>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Project HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --trans:.22s cubic-bezier(.2,0,0,1);
  --ease:cubic-bezier(.2,0,0,1);
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:28px;
  --sp:4px;
}
/* ── TONAL PALETTE: deep ink + periwinkle + apricot ── */
[data-theme="dark"]{
  --bg:#101219;
  --surface:#171A23;
  --surface2:#1E222D;
  --surface3:#272C39;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.14);
  --text:#E7E9F0;
  --text2:#A8AEC0;
  --muted:#767D91;
  --accent:#A9B8FF;         --accent-dim:rgba(169,184,255,.14); --accent-border:rgba(169,184,255,.28);
  --blue:#8FD0F0;           --blue-dim:rgba(143,208,240,.12);   --blue-border:rgba(143,208,240,.24);
  --warn:#F5B583;           --warn-dim:rgba(245,181,131,.13);   --warn-border:rgba(245,181,131,.26);
  --red:#F09098;            --red-dim:rgba(240,144,152,.12);
  --green:#8BD9AE;          --green-dim:rgba(139,217,174,.13);  --green-border:rgba(139,217,174,.26);
  --xp:#C3AEF5;             --xp-dim:rgba(195,174,245,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lift:0 2px 4px rgba(0,0,0,.4),0 16px 32px -12px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#F6F5F3;
  --surface:#FFFFFF;
  --surface2:#F1F0ED;
  --surface3:#E6E5E1;
  --border:rgba(18,20,28,.08);
  --border2:rgba(18,20,28,.16);
  --text:#171923;
  --text2:#4A4F5F;
  --muted:#787E8E;
  --accent:#4F5BC4;         --accent-dim:rgba(79,91,196,.09);  --accent-border:rgba(79,91,196,.24);
  --blue:#2A7FA8;           --blue-dim:rgba(42,127,168,.09);   --blue-border:rgba(42,127,168,.22);
  --warn:#A96426;           --warn-dim:rgba(169,100,38,.09);   --warn-border:rgba(169,100,38,.22);
  --red:#B2384C;            --red-dim:rgba(178,56,76,.09);
  --green:#1F7A54;          --green-dim:rgba(31,122,84,.09);   --green-border:rgba(31,122,84,.22);
  --xp:#6A4CB0;             --xp-dim:rgba(106,76,176,.09);
  --shadow:0 1px 2px rgba(20,22,30,.07),0 6px 18px -6px rgba(20,22,30,.10);
  --shadow-lift:0 2px 4px rgba(20,22,30,.08),0 14px 28px -10px rgba(20,22,30,.16);
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Roboto',system-ui,sans-serif;
  font-size:15px;line-height:1.5;
  min-height:100vh;padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
  transition:background var(--trans),color var(--trans);
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:12px 18px;display:flex;align-items:center;gap:10px;
}
.topbar h1{font-size:16px;font-weight:500;letter-spacing:-.2px;flex-shrink:0;}
.live-dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex-shrink:0;animation:pulse 3s var(--ease) infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.quick-capture{
  flex:1;background:var(--surface2);border:1px solid transparent;border-radius:999px;
  color:var(--text);font-family:inherit;font-size:13px;padding:10px 16px;
  outline:none;min-width:0;transition:border-color var(--trans),background var(--trans);
}
.quick-capture:focus{border-color:var(--accent-border);background:var(--surface);}
.quick-capture::placeholder{color:var(--muted);}
.icon-btn{
  background:transparent;border:none;border-radius:999px;color:var(--text2);
  cursor:pointer;font-size:16px;width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--trans),color var(--trans);
}
.icon-btn:hover,.icon-btn:focus-visible{background:var(--surface2);color:var(--text);}

/* ── SYNC ── */
.sync-bar{padding:7px 18px 0;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;letter-spacing:.2px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background var(--trans);}
.sync-dot.ok{background:var(--green);}
.sync-dot.saving{background:var(--warn);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}

.main{padding:14px 18px 0;max-width:880px;margin:0 auto;}

/* ── QUOTE ── */
.quote-strip{
  position:relative;border-radius:var(--r-lg);
  padding:24px 46px;margin-bottom:18px;overflow:hidden;
  min-height:88px;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 140% at 12% 0%,var(--accent-dim),transparent 60%),
    radial-gradient(110% 130% at 90% 100%,var(--xp-dim),transparent 62%),
    var(--surface);
  border:1px solid var(--border);
}
.quote-text{
  font-size:19px;font-weight:300;line-height:1.4;letter-spacing:-.3px;
  text-align:center;color:var(--text);position:relative;z-index:1;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  text-wrap:balance;
}
.quote-text.fade{opacity:0;transform:translateY(8px);}
.quote-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;
  width:36px;height:36px;z-index:2;line-height:1;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--trans),color var(--trans);
}
.quote-nav:hover,.quote-nav:focus-visible{background:var(--surface2);color:var(--text);}
.quote-nav.prev{left:6px;} .quote-nav.next{right:6px;}
.quote-dots{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2;}
.quote-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);transition:background var(--trans),width var(--trans);}
.quote-dot.on{background:var(--accent);width:14px;border-radius:999px;}

/* ── FOCUS HERO (signature) ── */
.focus-card{
  position:relative;border-radius:var(--r-lg);padding:22px 22px 20px;margin-bottom:18px;
  background:linear-gradient(150deg,var(--accent-dim),transparent 70%),var(--surface);
  border:1px solid var(--accent-border);
  box-shadow:var(--shadow);
}
.focus-label{
  font-size:11px;color:var(--accent);letter-spacing:1.6px;text-transform:uppercase;
  font-weight:500;margin-bottom:10px;
}
.focus-text{font-size:21px;font-weight:400;line-height:1.32;letter-spacing:-.4px;text-wrap:balance;}
.focus-sub{font-size:12px;color:var(--text2);margin-top:7px;}
.focus-actions{display:flex;gap:7px;margin-top:16px;}
.focus-actions .focus-btn{flex:1;white-space:nowrap;padding:10px 6px;}
.focus-btn{
  font-family:inherit;font-size:12.5px;font-weight:500;padding:10px 14px;border-radius:999px;
  cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);
  transition:background var(--trans),color var(--trans),transform .1s var(--ease);
}
.focus-btn:hover{background:var(--surface2);color:var(--text);}
.focus-btn:active{transform:scale(.97);}
.focus-btn.primary{background:var(--accent);border-color:transparent;color:var(--bg);font-weight:500;}
.focus-btn.primary:hover{filter:brightness(1.08);color:var(--bg);}


/* ── TREND HEATMAP (ersetzt Streak-Zähler) ── */
.trend-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;margin-bottom:20px;}
.trend-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px;}
.trend-label{font-size:12px;color:var(--text2);}
.trend-val{font-size:12px;color:var(--muted);}
.trend-grid{display:flex;gap:5px;}
.trend-cell{flex:1;height:30px;border-radius:6px;background:var(--surface3);position:relative;transition:background var(--trans),transform .12s var(--ease);cursor:default;}
.trend-cell.full{background:var(--green);}
.trend-cell.lazy{background:var(--warn);opacity:.75;}
.trend-cell.today{box-shadow:0 0 0 2px var(--accent);}
.trend-foot{display:flex;gap:14px;margin-top:11px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
.trend-key{display:flex;align-items:center;gap:5px;}
.trend-swatch{width:9px;height:9px;border-radius:3px;}

/* ── WENN/DANN ── */
.plan-row{display:flex;gap:8px;margin-top:14px;}
.plan-input{
  background:var(--surface2);border:1px solid transparent;border-radius:999px;color:var(--text);
  font-family:inherit;font-size:13px;padding:9px 15px;outline:none;flex:1;min-width:0;
  transition:border-color var(--trans);
}
.plan-input:focus{border-color:var(--accent-border);}
.plan-input::placeholder{color:var(--muted);}
.plan-set{font-size:12px;color:var(--accent);margin-top:11px;display:flex;align-items:center;gap:7px;}
.plan-edit{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:999px;font-family:inherit;}
.plan-edit:hover{color:var(--text);background:var(--surface2);}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.stat-pill{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;
}
.stat-val{font-size:22px;font-weight:400;letter-spacing:-.5px;line-height:1.1;}
.stat-key{font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.xp-pill .stat-val{color:var(--xp);} .streak-pill .stat-val{color:var(--warn);}

/* ── LEVEL ── */
.level-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:20px;}
.level-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.level-label{font-size:12px;color:var(--text2);}
.level-val{font-size:12px;color:var(--muted);}
.bar-track{background:var(--surface3);border-radius:999px;height:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--xp));transition:width .7s var(--ease);}

/* ── GRID + CARD ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow);
  transition:box-shadow var(--trans),border-color var(--trans),transform var(--trans);
  animation:cardIn .45s var(--ease) backwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);}
.card.stale{border-color:var(--red-dim);}
.card.hot{border-color:var(--accent-border);}
.card.urgent{border-color:var(--warn-border);}

.card-art{height:66px;width:100%;display:block;position:relative;overflow:hidden;background:var(--surface2);}
.card-art svg{display:block;width:100%;height:100%;}
.card-art::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,var(--surface) 100%);pointer-events:none;}

.card-header{padding:14px 17px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card-title{font-size:16px;font-weight:500;letter-spacing:-.2px;line-height:1.3;}
.card-meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;}
.card-badges{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;}
.toggle-arrow{color:var(--muted);font-size:11px;transition:transform var(--trans);}
.toggle-arrow.open{transform:rotate(90deg);}

.card-progress{padding:13px 17px 0;}
.progress-row{display:flex;justify-content:space-between;margin-bottom:6px;}
.progress-label{font-size:11px;color:var(--muted);}
.progress-pct{font-size:11px;color:var(--text2);}
.prog-track{background:var(--surface3);border-radius:999px;height:5px;overflow:hidden;}
.prog-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .6s var(--ease);}
.prog-fill.complete{background:var(--green);}
.card-spacer{height:14px;}

/* ── CHIPS (tonal, no hard borders) ── */
.badge{font-size:11px;font-weight:500;padding:4px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.3px;border:none;}
.badge-active{background:var(--accent-dim);color:var(--accent);}
.badge-paused{background:var(--warn-dim);color:var(--warn);}
.badge-idea{background:var(--blue-dim);color:var(--blue);}
.badge-done{background:var(--green-dim);color:var(--green);}
.badge-open{background:var(--surface3);color:var(--text2);}
.badge-stale{background:var(--red-dim);color:var(--red);}
.badge-urgent{background:var(--warn-dim);color:var(--warn);}

/* ── CARD BODY ── */
.card-body{padding:0 17px 16px;display:none;}
.card-body.open{display:block;animation:bodyIn .3s var(--ease);}
@keyframes bodyIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.section-label{font-size:11px;color:var(--muted);letter-spacing:1.3px;text-transform:uppercase;font-weight:500;margin:16px 0 6px;}
.item{display:flex;align-items:flex-start;gap:11px;padding:9px 0;font-size:14px;line-height:1.5;border-bottom:1px solid var(--border);}
.item:last-child{border-bottom:none;}
.item-check{
  width:21px;height:21px;border:1.5px solid var(--border2);border-radius:7px;flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:transparent;
  transition:border-color var(--trans),background var(--trans),color var(--trans),transform .12s var(--ease);
}
.item-check:hover{border-color:var(--accent);color:var(--accent);}
.item-check:active{transform:scale(.86);}
.item-dot{width:6px;height:6px;border-radius:50%;margin-top:8px;flex-shrink:0;background:var(--blue);}
.item-text{flex:1;color:var(--text2);min-width:0;overflow-wrap:anywhere;}
.item-del{background:none;border:none;color:transparent;cursor:pointer;font-size:16px;padding:0 4px;line-height:1;transition:color var(--trans);}
.item:hover .item-del{color:var(--border2);}
.item-del:hover{color:var(--red)!important;}
.item.done-item{opacity:.45;}
.item.done-item .item-text{text-decoration:line-through;}

.add-row{display:flex;gap:7px;margin-top:10px;}
.add-input{
  background:var(--surface2);border:1px solid transparent;border-radius:999px;color:var(--text);
  font-family:inherit;font-size:13px;padding:9px 14px;flex:1;outline:none;min-width:0;
  transition:border-color var(--trans);
}
.add-input:focus{border-color:var(--accent-border);}
.add-input::placeholder{color:var(--muted);}
.add-btn{
  background:var(--surface2);border:none;border-radius:999px;color:var(--text2);cursor:pointer;
  font-size:17px;width:38px;flex-shrink:0;transition:background var(--trans),color var(--trans);
}
.add-btn:hover{background:var(--accent-dim);color:var(--accent);}
.divider{height:1px;background:var(--border);margin:14px 0;}
.card-footer{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap;}
.status-select{
  background:var(--surface2);border:none;border-radius:999px;color:var(--text2);
  font-family:inherit;font-size:12px;padding:7px 12px;outline:none;cursor:pointer;
}
.del-btn{
  margin-left:auto;background:none;border:none;border-radius:999px;color:var(--muted);
  cursor:pointer;font-family:inherit;font-size:12px;padding:7px 13px;
  transition:background var(--trans),color var(--trans);
}
.del-btn:hover{background:var(--red-dim);color:var(--red);}

/* ── NEW PROJECT ── */
.new-proj-wrap{margin-top:22px;}
.new-proj-toggle{
  background:transparent;border:1.5px dashed var(--border2);border-radius:var(--r-lg);
  padding:16px 20px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--muted);
  width:100%;text-align:left;transition:border-color var(--trans),color var(--trans),background var(--trans);
}
.new-proj-toggle:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-dim);}
.new-proj-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-top:10px;display:none;box-shadow:var(--shadow);}
.new-proj-form.open{display:block;animation:bodyIn .3s var(--ease);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
.form-input{
  background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);color:var(--text);
  font-family:inherit;font-size:13px;padding:11px 13px;outline:none;width:100%;
  transition:border-color var(--trans);
}
.form-input:focus{border-color:var(--accent-border);}
.form-input::placeholder{color:var(--muted);}
.form-input.full{grid-column:1/-1;}
.form-submit{
  background:var(--accent);border:none;border-radius:999px;color:var(--bg);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;padding:12px;width:100%;margin-top:6px;
  transition:filter var(--trans),transform .1s var(--ease);
}
.form-submit:hover{filter:brightness(1.08);}
.form-submit:active{transform:scale(.98);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(8,9,13,.72);backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;padding:22px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;max-width:400px;width:100%;box-shadow:var(--shadow-lift);}
.modal h2{font-size:19px;font-weight:500;margin-bottom:10px;letter-spacing:-.3px;}
.modal p{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.6;}
.modal input{background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:14px;padding:12px 14px;width:100%;outline:none;margin-bottom:12px;}
.modal input:focus{border-color:var(--accent-border);}
.modal button{background:var(--accent);border:none;border-radius:999px;color:var(--bg);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;padding:12px;width:100%;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(18px);
  background:var(--surface3);border:1px solid var(--border);border-radius:999px;
  padding:11px 20px;font-family:inherit;font-size:13px;color:var(--text);
  opacity:0;transition:all .3s var(--ease);pointer-events:none;z-index:998;
  white-space:nowrap;box-shadow:var(--shadow-lift);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@keyframes xppop{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-34px) scale(1.35);}}
.xp-pop{position:fixed;font-family:inherit;font-size:14px;font-weight:500;color:var(--xp);pointer-events:none;z-index:1000;animation:xppop .9s var(--ease) forwards;}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:999px;}

@media (max-width:420px){
  .main{padding:12px 14px 0;}
  .quote-text{font-size:17px;}
  .focus-text{font-size:19px;}
  .stat-val{font-size:20px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

</style>
</head>
<body>

<!-- TOKEN MODAL -->
<div class="modal-overlay" id="tokenModal" style="display:none;">
  <div class="modal">
    <h2>🔑 GitHub Token</h2>
    <p>Für Cross-Device-Sync wird dein GitHub Personal Access Token einmalig im Browser gespeichert. Es wird nur genutzt um <code>data.json</code> im Repo zu lesen und zu schreiben.</p>
    <input id="tokenInput" type="password" placeholder="ghp_..."/>
    <button onclick="saveToken()">Token speichern & laden</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <span class="live-dot"></span>

<div class="sync-bar">

<div class="main">
  <div class="quote-strip" id="quoteStrip">
    <button class="quote-nav prev" onclick="shiftQuote(-1)">‹</button>

    <div class="new-proj-form" id="newProjForm">
      <div class="form-grid">
        <input class="form-input full" id="newName" placeholder="Projektname..."/>
        <input class="form-input full" id="newMeta" placeholder="Kurzbeschreibung..."/>
        <select class="form-input" id="newStatus">
          <option value="active">AKTIV</option>
          <option value="open">OFFEN</option>
          <option value="idea">IDEE</option>
          <option value="paused">PAUSIERT</option>
          <option value="done">DONE</option>
        </select>
        <input class="form-input" id="newDeadline" type="date"/>
      </div>
      <button class="form-submit" onclick="addProject()">PROJEKT ANLEGEN →</button>
    </div>
  </div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ─────────────────────────────────
const OWNER = 'chris61ds-alt';
const REPO  = 'project-hq';
const FILE  = 'data.json';
const XP_DONE = 15;
const XP_PER_LEVEL = 200;

// ── STATE ──────────────────────────────────
let data = { projects:[], xp:0, streak:0, lastActive:null, theme:'dark' };
let fileSha = null;
let openCards = new Set();
let focusIdx = 0;
let saveTimer = null;
let theme = 'dark';

// ── TOKEN ─────────────────────────────────
function getToken() { return localStorage.getItem('phq_token') || ''; }
function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('phq_token', t);
  document.getElementById('tokenModal').style.display = 'none';
  loadData();
}

// ── GITHUB API ────────────────────────────
async function ghGet() {
  const token = getToken();
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`, {
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error('GET failed ' + r.status);
  const j = await r.json();
  fileSha = j.sha;
  return JSON.parse(atob(j.content.replace(/\n/g,'')));
}

async function ghPut(payload) {
  const token = getToken();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
  const body = { message: 'Update dashboard data', content, sha: fileSha };
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`, {
    method: 'PUT',
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('PUT failed ' + r.status);
  const j = await r.json();
  fileSha = j.content.sha;
}

// ── LOAD / SAVE ───────────────────────────
async function loadData() {
  setSyncStatus('saving', 'Lade...');
  try {
    data = await ghGet();
    data.projects.forEach(p => { if (!p.done) p.done = []; if (p.deadline===undefined) p.deadline=null; });
    if (data.theme) setTheme(data.theme);
    updateStreak();
    setSyncStatus('ok', 'Synchronisiert · ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    render();
  } catch(e) {
    setSyncStatus('error', 'Fehler: ' + e.message);
    // fallback to localStorage
    const cached = localStorage.getItem('phq_cache');
    if (cached) { data = JSON.parse(cached); render(); }
  }
}

async function syncNow() { await loadData(); }

function scheduleSave() {
  clearTimeout(saveTimer);
  setSyncStatus('saving', 'Speichert...');
  saveTimer = setTimeout(async () => {
    try {
      localStorage.setItem('phq_cache', JSON.stringify(data)); // cache locally
      await ghPut(data);
      setSyncStatus('ok', 'Synchronisiert · ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    } catch(e) {
      setSyncStatus('error', 'Sync-Fehler – lokal gespeichert');
    }
  }, 1200);
}

function setSyncStatus(state, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('syncStatus').textContent = msg;
}

// ── STREAK ────────────────────────────────
function updateStreak() {
  // Kein harter Streak mehr: der 14-Tage-Trend ersetzt den Zaehler.
  ensureLog();
  if(!data.plans || typeof data.plans !== 'object') data.plans = {};
  if(!data.lastActive) data.lastActive = new Date().toDateString();
}


// ── TAGES-LOG (Trend statt Streak) ────────
// data.log = { "2026-08-26": "full" | "lazy" }
const XP_SHOW_UP = 5;
function dayKey(d){const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function ensureLog(){ if(!data.log || typeof data.log !== 'object') data.log = {}; return data.log; }

function markDay(state){
  const log = ensureLog();
  const k = dayKey();
  if (log[k] === 'full') return;          // voller Tag bleibt voller Tag
  log[k] = state;
  data.lastActive = new Date().toDateString();
}

function last14(){
  const out = [];
  for (let i = 13; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    out.push({key: dayKey(d), state: (ensureLog())[dayKey(d)] || null, isToday: i === 0});
  }
  return out;
}

// "Nie zwei Tage hintereinander" statt starrem Streak
function missedInARow(){
  const log = ensureLog();
  let n = 0;
  for (let i = 1; i <= 14; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    if (log[dayKey(d)]) break;
    n++;
  }
  return n;
}
function rate14(){
  const days = last14();
  const hit = days.filter(d => d.state).length;
  return Math.round(hit / 14 * 100);
}

function renderTrend(){
  const el = document.getElementById('trendCard');
  if(!el) return;
  const days = last14();
  const pct = rate14();
  const missed = missedInARow();
  let note;
  if (missed >= 2) note = 'Zwei Tage Pause – heute wieder anknüpfen';
  else if (pct >= 80) note = 'Guter Rhythmus';
  else note = 'Ziel: 80 % – nicht 100 %';
  el.innerHTML = `
    <div class="trend-head">
      <span class="trend-label">Letzte 14 Tage · ${pct}%</span>
      <span class="trend-val">${note}</span>
    </div>
    <div class="trend-grid">
      ${days.map(d=>`<div class="trend-cell ${d.state==='full'?'full':d.state==='lazy'?'lazy':''} ${d.isToday?'today':''}" title="${d.key}"></div>`).join('')}
    </div>
    <div class="trend-foot">
      <span class="trend-key"><span class="trend-swatch" style="background:var(--green)"></span>Erledigt</span>
      <span class="trend-key"><span class="trend-swatch" style="background:var(--warn);opacity:.75"></span>Drangewesen</span>
      <span class="trend-key"><span class="trend-swatch" style="background:var(--surface3)"></span>Pause</span>
    </div>`;
}

// ── WENN / DANN ───────────────────────────
function renderPlan(){
  const slot = document.getElementById('planSlot');
  if(!slot) return;
  const k = dayKey();
  if(!data.plans || typeof data.plans !== 'object') data.plans = {};
  const plan = data.plans[k];
  if (plan) {
    slot.innerHTML = `<div class="plan-set">🕑 ${esc(plan)}<button class="plan-edit" onclick="clearPlan()">ändern</button></div>`;
  } else {
    slot.innerHTML = `<div class="plan-row">
      <input class="plan-input" id="planInput" placeholder="Wann & wo? z.B. 19 Uhr, Küchentisch" onkeydown="if(event.key==='Enter')savePlan()"/>
      <button class="focus-btn" onclick="savePlan()">Setzen</button>
    </div>`;
  }
}
function savePlan(){
  const inp = document.getElementById('planInput');
  if(!inp) return;
  const v = inp.value.trim();
  if(!v) return;
  if(!data.plans) data.plans = {};
  data.plans[dayKey()] = v;
  scheduleSave(); renderPlan(); showToast('Vorsatz gesetzt');
}
function clearPlan(){
  if(data.plans) delete data.plans[dayKey()];
  scheduleSave(); renderPlan();
}

// ── LAZY DAY ──────────────────────────────
function markLazy(){
  markDay('lazy');
  data.xp = (data.xp||0) + XP_SHOW_UP;
  showXPPop(XP_SHOW_UP);
  scheduleSave(); render();
  showToast('Zählt trotzdem');
}

// ── THEME ─────────────────────────────────
function setTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0a0a0c' : '#f2f2ee';
}
function toggleTheme() {
  const t = theme === 'dark' ? 'light' : 'dark';
  setTheme(t); data.theme = t; scheduleSave();
}

// ── MOMENTUM ──────────────────────────────
function momentum(proj) {
  if (!proj.lastTouched) return 'normal';
  const days = Math.floor((Date.now() - proj.lastTouched) / 86400000);
  if (proj.status === 'active' && proj.todos.length > 0 && days > 7) return 'stale';
  if (days < 2) return 'hot';
  return 'normal';
}
function deadlineDays(proj) {
  if (!proj.deadline) return null;
  return Math.floor((new Date(proj.deadline) - new Date()) / 86400000);
}

// ── FOCUS ─────────────────────────────────
function buildFocusItems() {
  const items = [];
  const add = (p, t, urgency, extra={}) => items.push({proj:p, todo:t, urgency, ...extra});
  data.projects.forEach(p => {
    if (p.status !== 'active') return;
    const dd = deadlineDays(p);
    if (dd !== null && dd <= 14) p.todos.slice(0,1).forEach(t => add(p,t,'deadline',{days:dd}));
  });
  data.projects.forEach(p => {
    if (p.status !== 'active') return;
    if (momentum(p) === 'stale') p.todos.slice(0,1).forEach(t => { if (!items.find(i=>i.todo===t&&i.proj===p)) add(p,t,'stale'); });
  });
  data.projects.forEach(p => {
    if (p.status !== 'active') return;
    p.todos.slice(0,1).forEach(t => { if (!items.find(i=>i.todo===t&&i.proj===p)) add(p,t,'normal'); });
  });
  return items;
}

function renderFocus() {
  const items = buildFocusItems();
  if (!items.length) {
    document.getElementById('focusText').textContent = 'Keine offenen Todos – 🎉';
    document.getElementById('focusSub').textContent = 'Füge neue Todos hinzu.';
    return;
  }
  const item = items[focusIdx % items.length];
  document.getElementById('focusText').textContent = item.todo;
  let sub = `📁 ${item.proj.name}`;
  if (item.urgency === 'deadline') sub += `  ·  ⚠️ Deadline in ${item.days} Tagen`;
  if (item.urgency === 'stale') sub += `  ·  💤 Braucht Aufmerksamkeit`;
  document.getElementById('focusSub').textContent = sub;
}

function markFocusDone() {
  const items = buildFocusItems();
  if (!items.length) return;
  const item = items[focusIdx % items.length];
  const proj = data.projects.find(p => p.id === item.proj.id);
  if (!proj) return;
  const ti = proj.todos.indexOf(item.todo);
  if (ti > -1) {
    proj.todos.splice(ti, 1);
    proj.done.push(item.todo);
    proj.lastTouched = Date.now();
    data.xp = (data.xp||0) + XP_DONE;
    markDay('full');
    showXPPop(XP_DONE);
    scheduleSave(); render();
  }
}
function skipFocus() {
  const items = buildFocusItems();
  focusIdx = (focusIdx + 1) % Math.max(items.length, 1);
  renderFocus();
}

// ── XP ────────────────────────────────────
function xpLevel() {
  const xp = data.xp||0;
  return { level: Math.floor(xp/XP_PER_LEVEL)+1, progress: ((xp%XP_PER_LEVEL)/XP_PER_LEVEL)*100, xpToNext: XP_PER_LEVEL-(xp%XP_PER_LEVEL), xp };
}
function showXPPop(n) {
  const el = document.createElement('div');
  el.className = 'xp-pop';
  el.textContent = `+${n} XP`;
  el.style.cssText = 'left:50%;top:80px;transform:translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}

// ── QUICK CAPTURE ─────────────────────────
function handleQuickCapture(e) {
  if (e.key !== 'Enter') return;
  const val = e.target.value.trim(); if (!val) return;
  let routed = false;
  for (const proj of data.projects) {
    if (val.toLowerCase().startsWith(proj.name.toLowerCase()+':') || val.toLowerCase().startsWith(proj.id.toLowerCase()+':')) {
      let content = val.slice(val.indexOf(':')+1).trim();
      const isIdea = /^idee[:\s]/i.test(content);
      if (isIdea) content = content.replace(/^idee[:\s]/i,'').trim();
      if (isIdea) proj.ideas.push(content); else { proj.todos.push(content); proj.lastTouched=Date.now(); }
      openCards.add(proj.id);
      showToast(`✓ → ${proj.name}`);
      routed = true; break;
    }
  }
  if (!routed) {
    const first = data.projects.find(p=>p.status==='active');
    if (first) { first.todos.push(val); first.lastTouched=Date.now(); openCards.add(first.id); showToast(`→ ${first.name} (kein Match)`); }
  }
  e.target.value = '';
  scheduleSave(); render();
}

// ── RENDER ────────────────────────────────
const SM = {active:{l:'AKTIV',c:'badge-active'},paused:{l:'PAUSIERT',c:'badge-paused'},onhold:{l:'ON HOLD',c:'badge-paused'},idea:{l:'IDEE',c:'badge-idea'},done:{l:'DONE',c:'badge-done'},open:{l:'OFFEN',c:'badge-open'}};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render() {
  // Stats
  const p = data.projects;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill"><span class="stat-val">${p.length}</span><span class="stat-key">Projekte</span></div>
    <div class="stat-pill"><span class="stat-val">${p.filter(x=>x.status==='active').length}</span><span class="stat-key">Aktiv</span></div>
    <div class="stat-pill"><span class="stat-val">${p.reduce((s,x)=>s+x.todos.length,0)}</span><span class="stat-key">Todos</span></div>
    <div class="stat-pill"><span class="stat-val">${p.reduce((s,x)=>s+(x.done||[]).length,0)}</span><span class="stat-key">Erledigt</span></div>
  `;
  // Level
  const l = xpLevel();
  document.getElementById('levelBar').innerHTML = `
    <div class="level-row"><span class="level-label">Level ${l.level} · ${l.xp} XP</span><span class="level-val">${l.xpToNext} XP bis Level ${l.level+1}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${l.progress}%"></div></div>
  `;
  // Trend + Plan
  renderTrend();
  renderPlan();
  // Quotes
  renderQuote();
  restartQuoteTimer();
  // Focus
  renderFocus();
  // Grid
  const grid = document.getElementById('projectGrid');
  grid.innerHTML = '';
  let gridIdx = 0;
  const order = {active:0,open:1,idea:2,onhold:3,paused:4,done:5};
  [...data.projects].sort((a,b)=>(order[a.status]||5)-(order[b.status]||5)).forEach(proj => {
    const s = SM[proj.status]||SM.open;
    const isOpen = openCards.has(proj.id);
    const mom = momentum(proj);
    const total = proj.todos.length + (proj.done||[]).length;
    const doneCount = (proj.done||[]).length;
    const pct = total > 0 ? Math.round(doneCount/total*100) : 0;
    const dd = deadlineDays(proj);
    let cls = 'card';
    if (mom==='stale') cls+=' stale';
    else if (mom==='hot') cls+=' hot';
    if (dd!==null && dd<=7) cls+=' urgent';
    const card = document.createElement('div');
    card.className = cls;
    card.innerHTML = `
      ${genArt(proj)}
      <div class="card-header" onclick="toggle('${proj.id}')">
        <div style="flex:1;min-width:0">
          <div class="card-title">${esc(proj.name)} ${mom==='stale'?'<span class="badge badge-stale">STALE</span>':''} ${mom==='hot'?'🔥':''}</div>
          <div class="card-meta">${esc(proj.meta)}${dd!==null?` · 📅 ${dd}d`:''}</div>
        </div>
        <div class="card-badges">
          <span class="badge ${s.c}">${s.l}</span>
          <span class="toggle-arrow ${isOpen?'open':''}">▶</span>
        </div>
      </div>
      ${total>0?`<div class="card-progress"><div class="progress-row"><span class="progress-label">${doneCount}/${total} erledigt</span><span class="progress-pct">${pct}%</span></div><div class="prog-track"><div class="prog-fill ${pct===100?'complete':''}" style="width:${pct}%"></div></div></div>`:'<div class="card-spacer"></div>'}
      <div class="card-body ${isOpen?'open':''}">
        <div class="section-label">💡 Ideen (${proj.ideas.length})</div>
        ${proj.ideas.map((x,i)=>`<div class="item"><div class="item-dot"></div><div class="item-text">${esc(x)}</div><button class="item-del" onclick="rmItem('${proj.id}','ideas',${i})">×</button></div>`).join('')}
        <div class="add-row"><input class="add-input" id="ii-${proj.id}" placeholder="Idee..." onkeydown="if(event.key==='Enter')addItem('${proj.id}','ideas')"/><button class="add-btn" onclick="addItem('${proj.id}','ideas')">+</button></div>
        <div class="divider"></div>
        <div class="section-label">☑ Todos (${proj.todos.length})</div>
        ${proj.todos.map((x,i)=>`<div class="item"><div class="item-check" onclick="completeTodo('${proj.id}',${i})">✓</div><div class="item-text">${esc(x)}</div><button class="item-del" onclick="rmItem('${proj.id}','todos',${i})">×</button></div>`).join('')}
        ${(proj.done||[]).length>0?`<div class="section-label" style="color:var(--green)">✓ Done (${proj.done.length})</div>${proj.done.map((x,i)=>`<div class="item done-item"><div class="item-text">${esc(x)}</div><button class="item-del" onclick="undoTodo('${proj.id}',${i})">↩</button></div>`).join('')}`:''}
        <div class="add-row"><input class="add-input" id="ti-${proj.id}" placeholder="Todo..." onkeydown="if(event.key==='Enter')addItem('${proj.id}','todos')"/><button class="add-btn" onclick="addItem('${proj.id}','todos')">+</button></div>
        <div class="card-footer">
          <select class="status-select" onchange="chStatus('${proj.id}',this.value)">${Object.entries(SM).map(([k,v])=>`<option value="${k}" ${proj.status===k?'selected':''}>${v.l}</option>`).join('')}</select>
          ${dd!==null?`<span class="badge ${dd<=7?'badge-urgent':'badge-open'}">📅 ${dd}d</span>`:''}
          <button class="del-btn" onclick="rmProject('${proj.id}')">löschen</button>
        </div>
      </div>
    `;
    card.style.animationDelay = Math.min(gridIdx*45,320)+'ms';
    gridIdx++;
    grid.appendChild(card);
  });
}



// ── QUOTE SLIDER ──────────────────────────
const FALLBACK_QUOTES = ["You only have one life!"];
let quoteIdx = 0, quoteTimer = null;

function quotes(){
  const q = (data && Array.isArray(data.quotes) && data.quotes.length) ? data.quotes : FALLBACK_QUOTES;
  return q;
}
function renderQuote(){
  const q = quotes();
  if(quoteIdx >= q.length) quoteIdx = 0;
  const el = document.getElementById('quoteText');
  if(!el) return;
  el.classList.add('fade');
  setTimeout(()=>{
    el.textContent = q[quoteIdx];
    el.classList.remove('fade');
  }, 180);
  const dots = document.getElementById('quoteDots');
  dots.innerHTML = q.length > 1
    ? q.map((_,i)=>`<div class="quote-dot ${i===quoteIdx?'on':''}"></div>`).join('')
    : '';
  const showNav = q.length > 1 ? '' : 'none';
  document.querySelectorAll('.quote-nav').forEach(b=>b.style.display=showNav);
}
function shiftQuote(dir){
  const q = quotes();
  quoteIdx = (quoteIdx + dir + q.length) % q.length;
  renderQuote();
  restartQuoteTimer();
}
function restartQuoteTimer(){
  clearInterval(quoteTimer);
  if(quotes().length > 1) quoteTimer = setInterval(()=>shiftQuoteAuto(), 9000);
}
function shiftQuoteAuto(){
  const q = quotes();
  quoteIdx = (quoteIdx + 1) % q.length;
  renderQuote();
}

// ── GENERATIVE ART ────────────────────────
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rngFrom(seed){let s=seed>>>0;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

const ART_PALETTES = {
  active:  [['#A9B8FF','#7E8FE8','#171A23'],['#B6C2FF','#6E7FD8','#141721']],
  open:    [['#8FD0F0','#5E9FD0','#151A24'],['#A2DAF2','#4E8CC0','#131822']],
  idea:    [['#C3AEF5','#8FD0F0','#181624'],['#D2C0FA','#9FD8F5','#171525']],
  paused:  [['#F5B583','#C08258','#231C18'],['#EEC09A','#B07A50','#211A16']],
  onhold:  [['#F5B583','#A691C4','#221C22'],['#E8B492','#9A85B8','#1F1A20']],
  done:    [['#8BD9AE','#4FA37C','#152420'],['#A0E3BE','#5FAF8A','#13211E']]
};

function genArt(proj){
  const seed = hashStr(proj.id + '|' + proj.name);
  const rnd = rngFrom(seed);
  const pool = ART_PALETTES[proj.status] || ART_PALETTES.open;
  const pal = pool[Math.floor(rnd()*pool.length)];
  const [c1,c2,bg] = pal;
  const gid = 'g'+seed.toString(36);
  const W=400,H=74;
  let shapes='';
  const mode = Math.floor(rnd()*3);

  if(mode===0){ // flowing arcs
    for(let i=0;i<5;i++){
      const y = 12+rnd()*60, amp = 14+rnd()*30, sw = 1.2+rnd()*2.4;
      const col = i%2 ? c1 : c2, op = (0.18+rnd()*0.34).toFixed(2);
      shapes += `<path d="M-20 ${y.toFixed(1)} Q ${(W*0.3).toFixed(0)} ${(y-amp).toFixed(1)}, ${(W*0.55).toFixed(0)} ${y.toFixed(1)} T ${W+20} ${(y+amp*0.4).toFixed(1)}" fill="none" stroke="${col}" stroke-width="${sw.toFixed(1)}" opacity="${op}"/>`;
    }
  } else if(mode===1){ // orbital circles
    for(let i=0;i<7;i++){
      const cx = rnd()*W, cy = rnd()*H, r = 6+rnd()*32;
      const col = i%3===0 ? c1 : c2, op=(0.12+rnd()*0.30).toFixed(2);
      const filled = rnd()>0.55;
      shapes += filled
        ? `<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${r.toFixed(0)}" fill="${col}" opacity="${op}"/>`
        : `<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${r.toFixed(0)}" fill="none" stroke="${col}" stroke-width="1.4" opacity="${op}"/>`;
    }
  } else { // vertical rhythm bars
    let x=-4;
    while(x<W){
      const w = 5+rnd()*22, h = 12+rnd()*62, y = H-h;
      const col = rnd()>0.5 ? c1 : c2, op=(0.12+rnd()*0.32).toFixed(2);
      shapes += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="3" fill="${col}" opacity="${op}"/>`;
      x += w + 3 + rnd()*13;
    }
  }

  const ang = Math.floor(rnd()*360);
  return `<div class="card-art"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" gradientTransform="rotate(${ang} .5 .5)">
      <stop offset="0%" stop-color="${bg}"/><stop offset="100%" stop-color="${c2}" stop-opacity="0.20"/>
    </linearGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${gid})"/>${shapes}
  </svg></div>`;
}

// ── INTERACTIONS ──────────────────────────
function toggle(id){if(openCards.has(id))openCards.delete(id);else openCards.add(id);render();}

function completeTodo(pid,idx){
  const p=data.projects.find(x=>x.id===pid);if(!p)return;
  const[done]=p.todos.splice(idx,1);
  p.done.push(done);p.lastTouched=Date.now();
  data.xp=(data.xp||0)+XP_DONE;data.lastActive=new Date().toDateString();
  showXPPop(XP_DONE);openCards.add(pid);scheduleSave();render();
}
function undoTodo(pid,idx){
  const p=data.projects.find(x=>x.id===pid);if(!p||!p.done)return;
  const[t]=p.done.splice(idx,1);p.todos.push(t);
  data.xp=Math.max(0,(data.xp||0)-XP_DONE);
  openCards.add(pid);scheduleSave();render();
}
function addItem(pid,type){
  const inp=document.getElementById((type==='ideas'?'ii':'ti')+'-'+pid);
  const v=inp.value.trim();if(!v)return;
  const p=data.projects.find(x=>x.id===pid);if(!p)return;
  p[type].push(v);if(type==='todos')p.lastTouched=Date.now();
  inp.value='';openCards.add(pid);scheduleSave();render();
}
function rmItem(pid,type,idx){
  const p=data.projects.find(x=>x.id===pid);if(!p)return;
  p[type].splice(idx,1);openCards.add(pid);scheduleSave();render();
}
function chStatus(pid,status){
  const p=data.projects.find(x=>x.id===pid);if(!p)return;
  p.status=status;p.lastTouched=Date.now();openCards.add(pid);scheduleSave();render();
}
function rmProject(pid){
  if(!confirm('Projekt löschen?'))return;
  data.projects=data.projects.filter(x=>x.id!==pid);
  openCards.delete(pid);scheduleSave();render();
}
function addProject(){
  const name=document.getElementById('newName').value.trim();
  const meta=document.getElementById('newMeta').value.trim();
  const status=document.getElementById('newStatus').value;
  const deadline=document.getElementById('newDeadline').value||null;
  if(!name)return;
  const id='p'+Date.now();
  data.projects.push({id,name,meta,status,deadline,ideas:[],todos:[],done:[],lastTouched:Date.now()});
  document.getElementById('newName').value='';document.getElementById('newMeta').value='';
  document.getElementById('newDeadline').value='';
  document.getElementById('newProjForm').classList.remove('open');
  openCards.add(id);scheduleSave();render();
}

// ── TOAST ─────────────────────────────────
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

// ── INIT ──────────────────────────────────
(function init() {
  const token = getToken();
  if (!token) {
    document.getElementById('tokenModal').style.display = 'flex';
    setSyncStatus('error', 'Kein Token – bitte einrichten');
  } else {
    loadData();
  }
})();
</script>
