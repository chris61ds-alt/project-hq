<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum Coach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--trans:.2s;}
[data-theme="dark"]{
  --bg:#0a0a0c;--surface:#111116;--surface2:#18181f;--surface3:#20202a;
  --border:#2a2a35;--border2:#3a3a48;
  --text:#e8e8f0;--text2:#a0a0b8;--muted:#6b6b80;
  --accent:#c8f060;--accent-dim:rgba(200,240,96,.12);--accent-border:rgba(200,240,96,.25);
  --blue:#60c8f0;--blue-dim:rgba(96,200,240,.1);--blue-border:rgba(96,200,240,.2);
  --warn:#f0a060;--warn-dim:rgba(240,160,96,.1);--warn-border:rgba(240,160,96,.2);
  --red:#f06080;--red-dim:rgba(240,96,128,.1);
  --green:#60f0a0;--green-dim:rgba(96,240,160,.1);--green-border:rgba(96,240,160,.2);
  --xp:#a78bfa;--xp-dim:rgba(167,139,250,.12);
  --shadow:0 2px 16px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#f2f2ee;--surface:#ffffff;--surface2:#f0f0ea;--surface3:#e8e8e2;
  --border:#ddddd5;--border2:#c8c8be;
  --text:#1a1a1e;--text2:#4a4a5a;--muted:#8a8a9a;
  --accent:#4a8a00;--accent-dim:rgba(74,138,0,.08);--accent-border:rgba(74,138,0,.22);
  --blue:#0080b0;--blue-dim:rgba(0,128,176,.08);--blue-border:rgba(0,128,176,.2);
  --warn:#9a5000;--warn-dim:rgba(154,80,0,.08);--warn-border:rgba(154,80,0,.2);
  --red:#b02040;--red-dim:rgba(176,32,64,.08);
  --green:#006838;--green-dim:rgba(0,104,56,.08);--green-border:rgba(0,104,56,.22);
  --xp:#5030a0;--xp-dim:rgba(80,48,160,.08);
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;padding:0 0 40px;margin:0;transition:background var(--trans),color var(--trans);}
.mono{font-family:'IBM Plex Mono',monospace;}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;}
.title{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.theme-toggle{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text2);font-size:14px;cursor:pointer;}
.wrap{padding:0 16px;max-width:520px;margin:0 auto;}

.streak-row{display:flex;gap:10px;margin:10px 0 16px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
.stat-num{font-size:22px;font-weight:800;}
.stat-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}

.focus-card{background:var(--surface);border:1px solid var(--accent-border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.focus-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.focus-question{font-size:16px;font-weight:700;margin-bottom:10px;}
#focusInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Syne',sans-serif;font-size:14px;padding:10px 12px;outline:none;resize:none;min-height:44px;}
#focusInput:focus{border-color:var(--accent-border);}
.focus-actions{display:flex;gap:8px;margin-top:10px;}
.btn{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:9px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text2);flex:1;text-align:center;}
.btn-primary{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);font-weight:600;}
.btn.done{background:var(--green-dim);border-color:var(--green-border);color:var(--green);}

.section-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 8px;}

.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow);}
.proj-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.proj-name{font-size:14px;font-weight:700;}
.proj-meta{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px;}
.momentum-bar-bg{background:var(--surface3);border-radius:6px;height:6px;overflow:hidden;}
.momentum-bar{height:100%;border-radius:6px;transition:width .4s;}
.momentum-pct{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text2);margin-left:8px;white-space:nowrap;}
.proj-row{display:flex;align-items:center;}

.reflect-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:16px;box-shadow:var(--shadow);}
#reflectInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:none;min-height:38px;}
.reflect-log{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;}
.reflect-entry{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text2);border-left:2px solid var(--accent-border);padding-left:8px;}
.reflect-date{color:var(--muted);}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text2);opacity:0;transition:all .25s;pointer-events:none;z-index:998;white-space:nowrap;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);padding:10px 2px;}
</style>
</head>
<body data-theme="dark">
<header>
  <div class="title">⚡ Momentum Coach</div>
  <button class="theme-toggle" id="themeBtn">☾</button>
</header>

<div class="wrap">

  <div class="streak-row">
    <div class="stat">
      <div class="stat-num" id="streakNum">0</div>
      <div class="stat-label">Streak (Tage)</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="checkinsNum">0</div>
      <div class="stat-label">Check-ins gesamt</div>
    </div>
  </div>

  <div class="focus-card">
    <div class="focus-label">Fokus heute</div>
    <div class="focus-question">Woran arbeitest du heute 1–2h?</div>
    <textarea id="focusInput" placeholder="z.B. CurveDay Store-Listing finalisieren…"></textarea>
    <div class="focus-actions">
      <button class="btn" id="saveFocusBtn">Speichern</button>
      <button class="btn btn-primary" id="doneFocusBtn">✓ Erledigt</button>
    </div>
  </div>

  <div class="section-label">Momentum pro Projekt</div>
  <div id="projectList"></div>

  <div class="reflect-card">
    <div class="focus-label">Kurzreflexion (1 Satz)</div>
    <textarea id="reflectInput" placeholder="Wie lief's heute?"></textarea>
    <button class="btn btn-primary" id="saveReflectBtn" style="margin-top:8px;width:100%;">Eintragen</button>
    <div class="reflect-log" id="reflectLog"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "momentumCoachState";
const PROJECT_HQ_URL = "../data.json";

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try { return JSON.parse(raw); } catch(e){} }
  return {
    theme: "dark",
    streak: 0,
    lastCheckinDate: null,
    totalCheckins: 0,
    todayFocus: "",
    todayFocusDone: false,
    todayFocusDate: null,
    reflections: []
  };
}
let state = loadState();

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function todayStr(){
  return new Date().toDateString();
}

function isYesterday(dateStr){
  const d = new Date(dateStr);
  const y = new Date();
  y.setDate(y.getDate()-1);
  return d.toDateString() === y.toDateString();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function applyTheme(){
  document.body.setAttribute("data-theme", state.theme);
  document.getElementById("themeBtn").textContent = state.theme === "dark" ? "☾" : "☀";
}

function renderStats(){
  document.getElementById("streakNum").textContent = state.streak;
  document.getElementById("checkinsNum").textContent = state.totalCheckins;
}

function renderFocus(){
  const isToday = state.todayFocusDate === todayStr();
  document.getElementById("focusInput").value = isToday ? state.todayFocus : "";
  const doneBtn = document.getElementById("doneFocusBtn");
  if(isToday && state.todayFocusDone){
    doneBtn.textContent = "✓ Erledigt";
    doneBtn.classList.add("done");
  } else {
    doneBtn.textContent = "✓ Erledigt";
    doneBtn.classList.remove("done");
  }
}

function renderReflections(){
  const log = document.getElementById("reflectLog");
  if(state.reflections.length === 0){
    log.innerHTML = '<div class="empty">Noch keine Einträge.</div>';
    return;
  }
  log.innerHTML = state.reflections.slice().reverse().slice(0,10).map(r =>
    `<div class="reflect-entry"><span class="reflect-date">${r.date}</span> — ${escapeHtml(r.text)}</div>`
  ).join("");
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function momentumColor(pct){
  if(pct >= 66) return "var(--green)";
  if(pct >= 33) return "var(--accent)";
  return "var(--warn)";
}

function computeMomentum(p){
  const doneCt = (p.done||[]).length;
  const todoCt = (p.todos||[]).length;
  const total = doneCt + todoCt;
  let pct = total > 0 ? Math.round((doneCt/total)*100) : (p.status === "active" ? 15 : 0);
  if(p.status === "idea") pct = Math.min(pct, 20);
  return pct;
}

async function renderProjects(){
  const list = document.getElementById("projectList");
  try{
    const res = await fetch(PROJECT_HQ_URL, {cache:"no-store"});
    const data = await res.json();
    const active = (data.projects||[]).filter(p => p.status === "active");
    if(active.length === 0){
      list.innerHTML = '<div class="empty">Keine aktiven Projekte gefunden.</div>';
      return;
    }
    list.innerHTML = active.map(p => {
      const pct = computeMomentum(p);
      const color = momentumColor(pct);
      return `<div class="proj-card">
        <div class="proj-top">
          <div>
            <div class="proj-name">${escapeHtml(p.name)}</div>
            <div class="proj-meta">${escapeHtml(p.meta||"")}</div>
          </div>
        </div>
        <div class="proj-row">
          <div class="momentum-bar-bg" style="flex:1;">
            <div class="momentum-bar" style="width:${pct}%;background:${color};"></div>
          </div>
          <div class="momentum-pct">${pct}%</div>
        </div>
      </div>`;
    }).join("");
  } catch(e){
    list.innerHTML = '<div class="empty">Projekte konnten nicht geladen werden (offline?).</div>';
  }
}

function doCheckin(){
  const today = todayStr();
  if(state.lastCheckinDate === today) return;
  if(state.lastCheckinDate && isYesterday(state.lastCheckinDate)){
    state.streak += 1;
  } else {
    state.streak = 1;
  }
  state.lastCheckinDate = today;
  state.totalCheckins += 1;
  saveState();
  renderStats();
}

document.getElementById("themeBtn").addEventListener("click", ()=>{
  state.theme = state.theme === "dark" ? "light" : "dark";
  saveState();
  applyTheme();
});

document.getElementById("saveFocusBtn").addEventListener("click", ()=>{
  const val = document.getElementById("focusInput").value.trim();
  state.todayFocus = val;
  state.todayFocusDate = todayStr();
  state.todayFocusDone = false;
  saveState();
  doCheckin();
  showToast("Fokus gespeichert");
  renderFocus();
});

document.getElementById("doneFocusBtn").addEventListener("click", ()=>{
  if(!document.getElementById("focusInput").value.trim()){
    showToast("Erst Fokus eintragen");
    return;
  }
  state.todayFocus = document.getElementById("focusInput").value.trim();
  state.todayFocusDate = todayStr();
  state.todayFocusDone = true;
  saveState();
  doCheckin();
  showToast("Stark gemacht 💪");
  renderFocus();
});

document.getElementById("saveReflectBtn").addEventListener("click", ()=>{
  const val = document.getElementById("reflectInput").value.trim();
  if(!val) return;
  state.reflections.push({date: new Date().toLocaleDateString("de-DE"), text: val});
  saveState();
  document.getElementById("reflectInput").value = "";
  renderReflections();
  showToast("Reflexion gespeichert");
});

applyTheme();
renderStats();
renderFocus();
renderReflections();
renderProjects();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
